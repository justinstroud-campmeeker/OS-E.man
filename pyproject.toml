[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-e-man"
dynamic = ["version"]
description = "An idle-style terminal game about a DevOps consultant and a coffee pod empire."
requires-python = ">=3.11"
dependencies = ["asyncssh>=2.14", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
director = ["httpx>=0.27"]   # only for --model groq / local

[project.scripts]
osEman = "os_e_man.__main__:main"

[tool.setuptools.packages.find]
include = ["os_e_man*"]

[tool.setuptools.dynamic]
version = {attr = "os_e_man.__version__"}

[tool.setuptools]
include-package-data = true  # everything MANIFEST.in grafts (all of content/, dotfiles too)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
